stages:
  - lint
  - test
  - build

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  IMAGE_VERSION: ""

services:
  - name: docker:dind
    command: ["--tls=false"]

lint:
  stage: lint
  image: python:3.9-alpine
  before_script:
    - python -m pip install --upgrade pip
    - pip install flake8
  script:
    - flake8

test:
  stage: test
  image: docker:20.10.15-alpine3.15
  script:
    - sh run-tests.sh

# Template genérico para builds
.build_template:
  image: docker:20.10.15-alpine3.15
  services:
    - docker:20.10.15-dind-alpine3.15
  before_script:
    - apk add --no-cache docker-cli-buildx
  script:
    - echo "Building ${IMAGE_NAME}..."
    - ls -l ${DOCKERFILE_PATH}
    - docker buildx build --file=${DOCKERFILE_PATH} --tag=${IMAGE_NAME} ${BUILD_CONTEXT}
    - |-
      IMAGE_VERSION="${IMAGE_VERSION:-$(date +%Y%m%d)-${CI_COMMIT_SHORT_SHA}}"
      echo "Using IMAGE_VERSION=${IMAGE_VERSION}"
      echo "Pushing image ${IMAGE_NAME}..."
      if [ "${CI_COMMIT_BRANCH}" == "main" ]; then
        echo "${DOCKER_SECRET}" | docker login --username "${DOCKER_USERNAME}" --password-stdin
        docker tag ${IMAGE_NAME} docker.io/omnileads/${IMAGE_NAME}:$IMAGE_VERSION
        docker push docker.io/omnileads/${IMAGE_NAME}:$IMAGE_VERSION
        echo "docker.io/omnileads/${IMAGE_NAME}:$IMAGE_VERSION"
      else
        echo "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USER}" --password-stdin
        docker tag ${IMAGE_NAME} docker.io/freetechsolutions/${IMAGE_NAME}:$IMAGE_VERSION
        docker push docker.io/freetechsolutions/${IMAGE_NAME}:$IMAGE_VERSION
        echo "docker.io/freetechsolutions/${IMAGE_NAME}:$IMAGE_VERSION"
      fi
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /build/'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Builds específicos para cada componente
container-image-asterisk:
  extends: .build_template
  stage: build
  variables:
    IMAGE_NAME: "dialer_asterisk"
    DOCKERFILE_PATH: "asterisk/Dockerfile"
    BUILD_CONTEXT: "asterisk"

container-image-dialplan:
  extends: .build_template
  stage: build
  variables:
    IMAGE_NAME: "dialer_dialplan"
    DOCKERFILE_PATH: "dialplan/Dockerfile"
    BUILD_CONTEXT: "dialplan"

container-image-api:
  extends: .build_template
  stage: build
  variables:
    IMAGE_NAME: "dialer_api"
    DOCKERFILE_PATH: "interface/src/Dockerfile"
    BUILD_CONTEXT: "interface/src"

container-image-worker:
  extends: .build_template
  stage: build
  variables:
    IMAGE_NAME: "dialer_worker"
    DOCKERFILE_PATH: "workers/handle-campaign/src/Dockerfile"
    BUILD_CONTEXT: "workers/handle-campaign/src"

container-image-websocket_ari:
  extends: .build_template
  stage: build
  variables:
    IMAGE_NAME: "dialer_listener"
    DOCKERFILE_PATH: "websocket_ari/src/Dockerfile"
    BUILD_CONTEXT: "websocket_ari/src"
