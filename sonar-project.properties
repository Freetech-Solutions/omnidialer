# Unique identifier of the project in SonarQube
sonar.projectKey=omnileads-dialer

# Name of the project
sonar.projectName=OMniLeads Dialer

# Path to the source directories
sonar.sources=.

# Exclude static assets, templates, tests fixtures and build artifacts
sonar.exclusions=**/testing/**, **/static/**, **/templates/**, **/__pycache__/**, **/.pytest_cache/**, **/htmlcov/**, **/venv/**, **/*.sql

# Path to test files
sonar.tests=.
sonar.test.inclusions=**/tests.py, test_*.py

# Encoding of the source files
sonar.sourceEncoding=UTF-8
